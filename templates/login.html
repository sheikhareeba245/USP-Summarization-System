{% extends "base.html" %}
{% block title %}Login — USP Summarization System{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-box">
        
        <div class="login-header">
            <h2>University of Southern Punjab</h2>
            <p>AI Document Summarization System</p>
        </div>

        <form method="POST" action="/login">
            
            <div class="form-group">
                <label for="username">USP Username</label>
                <input 
                    type="text" 
                    id="username"
                    name="username"
                    placeholder="e.g. BSIT023R24-10"
                    required
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label for="password">LMS Password</label>
                <input 
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your LMS password"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                Login with LMS Credentials
            </button>

        </form>

        <div class="login-note">
            Use your USP LMS username and password.<br>
            This system is exclusively for USP Multan students.
        </div>

    </div>
</div>
{% endblock %}
