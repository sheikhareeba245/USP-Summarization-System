{% extends "base.html" %}
{% block title %}Login — USP Summarization System{% endblock %}

{% block content %}
<style>
    
    .password-wrapper {
        position: relative;
        width: 100%;
        display: flex;
        align-items: center;
    }

    .password-wrapper input {
        width: 100%;
        padding-right: 55px; 
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        cursor: pointer;
        user-select: none;
        font-size: 0.8rem;
        font-weight: 600;
        color: #1a3a6b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .toggle-password:hover {
        color: #0056b3; 
    }
</style>

<div class="login-wrapper">
    <div class="login-box">
        
        <div class="login-header">
            <h2>University of Southern Punjab</h2>
            <p>AI Document Summarization System</p>
        </div>

        <form method="POST" action="/login">
            
            <div class="form-group">
                <label for="username">USP Username</label>
                <input 
                    type="text" 
                    id="username"
                    name="username"
                    placeholder="e.g. BSIT023R24-10"
                    required
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label for="password">LMS Password</label>
                <div class="password-wrapper">
                    <input 
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your LMS password"
                        required
                    >
                    <span class="toggle-password" id="togglePassword">Show</span>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Login with LMS Credentials
            </button>

        </form>

        <div class="login-note">
            Use your USP LMS username and password.<br>
            This system is exclusively for USP Multan students.
        </div>

    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');

    togglePasswordBtn.addEventListener('click', function () {
        // Check current type and flip it
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);

        this.textContent = type === 'password' ? 'Show' : 'Hide';
    });
});
</script>
{% endblock %}
